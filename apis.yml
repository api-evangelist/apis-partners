aid: apis-partners
name: Apis Partners
description: >-
  Apis Partners is a London-headquartered private equity asset manager investing
  in tech-enabled financial infrastructure and financial services businesses across
  Europe and Growth Markets. With additional offices in Dubai and Singapore, the firm
  backs companies in payments, digital banking, insurance technology and lending, taking
  minority positions with governance rights. Apis manages approximately $2.3 billion in
  assets under management and reports over $1 billion in portfolio realizations, with
  portfolio companies reaching more than 244 million people. It was surfaced as a portfolio
  company of Anthemis and added to the API Evangelist network for enrichment; the firm is
  an investor rather than an API producer, so it exposes no public developer API surface.
